name: Automated UFC Stats Scraper

on:
  schedule:
    - cron: '*/5 16-23 * * 6'
    - cron: '*/5 0-7 * * 0'
  
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scrape even if fights appear finished'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stealth Scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          SCRAPER_FILE=$(grep -rl "scrapeFullCard" --include="*.js" --include="*.mjs" --exclude-dir="node_modules" --exclude-dir=".next" --exclude-dir=".git" . | head -n 1)
          if [ -z "$SCRAPER_FILE" ]; then
            echo "❌ ERROR: Could not find your scraper script anywhere in the GitHub repo!"
            echo "👉 Make sure you saved the file in VS Code and ran: git add . && git commit -m 'add scraper' && git push"
            exit 1
          fi
          echo "🎯 Found scraper at: $SCRAPER_FILE"
          node "$SCRAPER_FILE"
